<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Box Quest · BlackReadBrown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════════════ */
:root{
  --obsidian:#0A0A0F; --panel:#12121C; --panel2:#1A1A2E;
  --gold:#FFD700; --gold2:#E6B800; --gold-dim:#4A3C00;
  --mint:#00E5A0; --mint-dim:#003D2B;
  --red:#FF3B5C; --red-dim:#3D0010;
  --silver:#C8C8D4; --silver2:#8888A0;
  --marvel:#E63946; --dc:#2979FF; --indie:#00BFA5; --licensed:#9C27B0; --other:#607D8B;
  --r:10px; --r-sm:6px;
  --shadow-gold:0 0 24px rgba(255,215,0,.22);
  --shadow-mint:0 0 24px rgba(0,229,160,.22);
  --transition:.28s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--obsidian);color:var(--silver);
  min-height:100vh;padding-bottom:100px;
  overflow-x:hidden;
}
::selection{background:var(--gold);color:var(--obsidian)}

/* ═══════════════════════════════════════════════════════════
   PARTICLES canvas (ambient)
═══════════════════════════════════════════════════════════ */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════ */
.wrap{max-width:900px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* ═══════════════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════════════ */
.hero{
  padding:48px 0 32px;text-align:center;
  position:relative;
}
.hero-eyebrow{
  font-family:'Inter';font-size:11px;font-weight:700;
  letter-spacing:.25em;text-transform:uppercase;
  color:var(--gold);margin-bottom:16px;opacity:.8;
}
.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,14vw,112px);
  line-height:.88;letter-spacing:.02em;
  color:#fff;margin-bottom:8px;
}
.hero-title span{color:var(--gold)}
.hero-sub{
  font-size:15px;color:var(--silver2);max-width:38ch;
  margin:0 auto 32px;line-height:1.5;
}

/* ═══════════════════════════════════════════════════════════
   MASTER PROGRESS
═══════════════════════════════════════════════════════════ */
.master{
  background:var(--panel);border:1px solid rgba(255,215,0,.15);
  border-radius:var(--r);padding:24px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.master::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(255,215,0,.06),transparent);
  pointer-events:none;
}
.master-ring-row{
  display:flex;align-items:center;justify-content:center;gap:32px;
  flex-wrap:wrap;margin-bottom:24px;
}
.ring-wrap{position:relative;width:130px;height:130px;flex:none}
.ring-wrap svg{width:130px;height:130px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:10}
.ring-fg{fill:none;stroke-width:10;stroke-linecap:round;
  stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.ring-fg.gold{stroke:url(#grad-gold)}
.ring-label{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring-pct{
  font-family:'Bebas Neue';font-size:34px;color:#fff;line-height:1;
}
.ring-sub{font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--silver2);margin-top:2px;}
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;
}
.stat{
  background:var(--panel2);border-radius:var(--r-sm);padding:14px 16px;
  text-align:center;border:1px solid rgba(255,255,255,.06);
}
.stat-num{
  font-family:'Bebas Neue';font-size:32px;color:var(--gold);
  line-height:1;display:block;
}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--silver2);margin-top:4px;display:block;}

/* ═══════════════════════════════════════════════════════════
   NEXT MOVE — hero card
═══════════════════════════════════════════════════════════ */
.next-card{
  background:linear-gradient(135deg,var(--gold-dim),var(--panel2));
  border:1.5px solid var(--gold);border-radius:var(--r);
  padding:20px;margin-bottom:20px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform var(--transition),box-shadow var(--transition);
  box-shadow:var(--shadow-gold);
}
.next-card:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(255,215,0,.3)}
.next-card::before{
  content:'NEXT SWEEP';
  position:absolute;top:14px;right:16px;
  font-family:'Bebas Neue';font-size:11px;letter-spacing:.2em;
  color:var(--gold);opacity:.5;
}
.next-arrow{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.next-box{
  font-family:'Bebas Neue';font-size:22px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r-sm);padding:6px 14px;color:#fff;
  white-space:nowrap;
}
.next-box.dest{background:rgba(0,229,160,.12);border-color:var(--mint);color:var(--mint)}
.next-arrow-icon{color:var(--gold);font-size:20px;font-weight:900}
.next-series{font-size:18px;font-weight:800;color:#fff;line-height:1.2}
.next-range{font-size:13px;color:var(--silver2);margin-top:4px}
.next-pulse{
  position:absolute;bottom:16px;right:16px;
  width:10px;height:10px;border-radius:50%;background:var(--gold);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}

/* ═══════════════════════════════════════════════════════════
   SPARE BOXES BANNER
═══════════════════════════════════════════════════════════ */
.spare-banner{
  background:var(--red-dim);border:1.5px solid var(--red);border-radius:var(--r);
  padding:14px 16px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.spare-icon{font-size:20px;flex:none}
.spare-text{font-size:13px;font-weight:600;flex:1;min-width:0;color:#fff}
.spare-chips{display:flex;gap:6px;flex-wrap:wrap}
.spare-chip{
  font-family:'Bebas Neue';font-size:13px;
  background:var(--red);color:#fff;
  padding:3px 10px;border-radius:4px;white-space:nowrap;
}

/* ═══════════════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════════════ */
.search-wrap{
  position:relative;margin-bottom:20px;
}
.search-wrap input{
  width:100%;background:var(--panel);border:1.5px solid rgba(255,255,255,.12);
  border-radius:var(--r);padding:14px 16px 14px 46px;
  font-family:'Inter';font-size:15px;color:#fff;outline:none;
  transition:border-color var(--transition);
}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap input::placeholder{color:var(--silver2)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--silver2);pointer-events:none}
#finder{margin-bottom:20px;display:none}
.finder-card{background:var(--panel);border:1.5px solid rgba(255,215,0,.3);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-gold)}
.finder-card h4{font-family:'Bebas Neue';letter-spacing:.08em;font-size:15px;color:var(--gold);margin-bottom:12px}
.finder-hit{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.fbx{font-family:'Bebas Neue';font-size:15px;background:rgba(255,215,0,.15);color:var(--gold);padding:4px 12px;border-radius:4px;white-space:nowrap}
.finfo{flex:1;min-width:0}
.fyr{font-weight:700;font-size:13px;color:#fff}
.fnm{font-size:12px;color:var(--silver2)}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD PILLS (publisher breakdown)
═══════════════════════════════════════════════════════════ */
.dash{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;
  scrollbar-width:none;
}
.dash::-webkit-scrollbar{display:none}
.pill{
  flex:none;background:var(--panel);border:1.5px solid rgba(255,255,255,.08);
  border-radius:24px;padding:8px 14px;display:flex;align-items:center;gap:8px;
  white-space:nowrap;cursor:pointer;transition:border-color var(--transition),background var(--transition);
  font-size:12px;font-weight:700;color:var(--silver);
}
.pill:hover{border-color:rgba(255,255,255,.2)}
.pill.active{border-color:var(--gold);background:rgba(255,215,0,.08);color:var(--gold)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill-pct{font-family:'Bebas Neue';font-size:14px;color:var(--silver2);margin-left:2px}
.pill.active .pill-pct{color:var(--gold)}

/* ═══════════════════════════════════════════════════════════
   QUEST CARDS
═══════════════════════════════════════════════════════════ */
.quest{
  background:var(--panel);border:1.5px solid rgba(255,255,255,.07);
  border-radius:var(--r);margin-bottom:12px;
  overflow:hidden;transition:opacity var(--transition),border-color var(--transition);
}
.quest[data-hidden]{display:none}
.quest.done{opacity:.5;border-color:rgba(0,229,160,.15)}
.quest.open{border-color:rgba(255,255,255,.14)}
.q-head{
  display:flex;align-items:center;gap:14px;padding:16px;
  cursor:pointer;user-select:none;
}
/* Franchise colour bar on left */
.q-spine{
  width:4px;height:48px;border-radius:2px;flex:none;
  background:var(--accent,#888);transition:height var(--transition);
}
.quest.open .q-spine{height:60px}
.q-title-col{flex:1;min-width:0}
.q-name{
  font-family:'Bebas Neue';font-size:clamp(17px,4.5vw,22px);
  letter-spacing:.04em;color:#fff;line-height:1;
}
.q-meta-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.q-pub{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:#fff}
.q-pub.marvel{background:var(--marvel)}
.q-pub.dc{background:var(--dc)}
.q-pub.indie{background:var(--indie)}
.q-pub.licensed{background:var(--licensed)}
.q-pub.other{background:var(--other)}
.q-count{font-size:12px;color:var(--silver2);font-weight:600}
/* Arc progress on right */
.q-ring{position:relative;width:52px;height:52px;flex:none}
.q-ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.q-rbg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:5}
.q-rfg{fill:none;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:135.2;stroke-dashoffset:135.2;
  transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);}
.q-rpct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue';font-size:14px;color:#fff;
}
.q-stamp{
  font-family:'Bebas Neue';font-size:11px;letter-spacing:.1em;
  color:var(--mint);border:1.5px solid var(--mint);border-radius:4px;
  padding:3px 8px;opacity:0;transition:opacity .3s;white-space:nowrap;flex:none;
}
.quest.done .q-stamp{opacity:1}
.q-chev{flex:none;color:var(--silver2);transition:transform .25s}
.quest.open .q-chev{transform:rotate(180deg)}

/* Body */
.q-body{display:none;padding:0 16px 16px}
.quest.open .q-body{display:block}

/* Box assignment (collapsed, subtle) */
.q-boxes-row{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 0 14px;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:14px;
}
.q-boxes-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silver2)}
.q-box-tag{
  font-family:'Bebas Neue';font-size:12px;
  color:var(--silver2);background:rgba(255,255,255,.05);
  border-radius:3px;padding:2px 7px;
}
.q-box-tag.spare{color:var(--red);background:rgba(255,59,92,.1)}

/* Section label */
.sec-label{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--silver2);margin:14px 0 8px;
}

/* Move block */
.move{
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden;
}
.move.done{border-color:rgba(0,229,160,.2);background:rgba(0,229,160,.03)}
.move-hd{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.03);
}
.move.done .move-hd{background:rgba(0,229,160,.05)}
.mv-route{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.bchip{
  font-family:'Bebas Neue';font-size:13px;
  background:rgba(255,255,255,.08);color:var(--silver);
  border-radius:4px;padding:3px 10px;white-space:nowrap;
}
.bchip.dest{background:rgba(0,229,160,.15);color:var(--mint)}
.bchip.spare{background:rgba(255,59,92,.15);color:var(--red)}
.mv-label{font-size:12px;color:var(--silver2);font-weight:600}
.mv-arr{color:var(--silver2);font-size:16px}
.mv-count{font-family:'Bebas Neue';font-size:14px;color:var(--accent,#888);flex:none}
.move-prog{height:3px;background:rgba(255,255,255,.06)}
.move-prog-fill{height:100%;background:var(--mint);transition:width .5s;width:0%}

/* Line items */
.lines{padding:4px 0}
.line{
  display:flex;align-items:flex-start;gap:11px;
  padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .2s;cursor:pointer;
}
.line:last-child{border-bottom:0}
.line:hover{background:rgba(255,255,255,.03)}
.line.checked{background:rgba(0,229,160,.04)}
.line input{position:absolute;opacity:0;width:0;height:0}
.cbox{
  width:22px;height:22px;border:2px solid rgba(255,255,255,.2);
  border-radius:5px;flex:none;display:grid;place-items:center;
  margin-top:1px;transition:.18s;background:transparent;
}
.line.checked .cbox{background:var(--mint);border-color:var(--mint)}
.cbox svg{opacity:0;transition:.18s}
.line.checked .cbox svg{opacity:1}
.l-body{flex:1;min-width:0}
.l-title{font-size:14px;font-weight:800;color:#fff;line-height:1.2}
.l-range{font-size:12.5px;color:var(--silver2);margin-top:2px;line-height:1.4}
.line.checked .l-title,.line.checked .l-range{color:rgba(0,229,160,.6);text-decoration:line-through}
.l-cnt{font-family:'Bebas Neue';font-size:13px;color:var(--silver2);white-space:nowrap;flex:none;margin-top:2px}
.line.checked .l-cnt{color:var(--mint)}

/* Clues */
.clue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.clue{
  background:rgba(255,215,0,.05);border:1px solid rgba(255,215,0,.15);
  border-radius:var(--r-sm);padding:10px 12px;
}
.clue-box{font-family:'Bebas Neue';font-size:16px;color:var(--gold);margin-bottom:4px}
.clue-yr{font-size:11px;font-weight:700;color:var(--silver2)}
.clue-titles{font-size:11px;color:var(--silver2);margin-top:4px;line-height:1.4}


.spare-banner{transition:opacity .4s ease, max-height .5s ease, padding .4s ease, margin .4s ease;
  max-height:120px;overflow:hidden;}
.spare-banner.dismissed{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0;border-width:0;}
.spare-check-label{display:flex;align-items:center;cursor:pointer;flex:none}
.spare-cbox{
  width:26px;height:26px;border:2.5px solid rgba(255,59,92,.6);border-radius:6px;
  display:grid;place-items:center;background:transparent;
  transition:background .2s,border-color .2s;flex:none;
}
.spare-cbox svg{opacity:0;transition:opacity .15s}
#spareCheck{position:absolute;opacity:0;width:0;height:0}

/* ═══════════════════════════════════════════════════════════
   CONFETTI / BURST canvas
═══════════════════════════════════════════════════════════ */
#burst{position:fixed;inset:0;pointer-events:none;z-index:9999}

/* ═══════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════ */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1.5px solid var(--gold);border-radius:50px;
  padding:12px 22px;font-size:14px;font-weight:700;color:#fff;
  box-shadow:var(--shadow-gold);opacity:0;transition:.35s ease;
  white-space:nowrap;z-index:1000;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.mint{border-color:var(--mint);box-shadow:var(--shadow-mint)}

/* ═══════════════════════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════════════════════ */
@media(max-width:600px){
  .master-ring-row{gap:20px}
  .ring-wrap{width:100px;height:100px}
  .ring-wrap svg{width:100px;height:100px}
  .ring-pct{font-size:26px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .clue-grid{grid-template-columns:1fr 1fr}
  .q-name{font-size:18px}
  .next-series{font-size:15px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

.spare-check-wrap{display:flex;align-items:center;cursor:pointer;flex:none}
.spare-cbox{
  width:26px;height:26px;border:2px solid var(--red);border-radius:6px;
  display:grid;place-items:center;background:transparent;
  transition:.2s;flex:none;
}
.spare-cbox svg{opacity:0;transition:.2s}
.spare-banner.checked .spare-cbox{background:var(--mint);border-color:var(--mint)}
.spare-banner.checked .spare-cbox svg{opacity:1}
.spare-banner{
  transition:opacity .4s ease, transform .4s ease, max-height .5s ease,
             padding .4s ease, margin .4s ease, border-width .4s ease;
  max-height:200px; overflow:hidden;
}
.spare-banner.dismissed{
  opacity:0;transform:translateY(-8px);
  max-height:0;padding-top:0;padding-bottom:0;
  margin-bottom:0;border-width:0;pointer-events:none;
}

</style>
</head>
<body>
<canvas id="particles"></canvas>
<canvas id="burst"></canvas>
<div class="toast" id="toast"></div>

<div class="wrap">

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">BlackReadBrown · Smart Sweep · 2026</div>
  <div class="hero-title">BOX<br><span>QUEST</span></div>
  <div class="hero-sub">9,535 comics. 25 franchises. One sweep at a time.</div>
</div>

<!-- MASTER RING -->
<div class="master">
  <svg width="0" height="0"><defs>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF9500"/>
    </linearGradient>
    <linearGradient id="grad-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5A0"/>
      <stop offset="100%" style="stop-color:#00BFA5"/>
    </linearGradient>
  </defs></svg>
  <div class="master-ring-row">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"/>
        <circle class="ring-fg gold" id="masterRing" cx="60" cy="60" r="54"/>
      </svg>
      <div class="ring-label">
        <div class="ring-pct" id="masterPct">0%</div>
        <div class="ring-sub">Overall</div>
      </div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat"><span class="stat-num" id="sDone">0</span><span class="stat-lbl">Steps Done</span></div>
    <div class="stat"><span class="stat-num" id="sTotal">0</span><span class="stat-lbl">Total Steps</span></div>
    <div class="stat"><span class="stat-num" id="sBooks">0</span><span class="stat-lbl">Books Filed</span></div>
    <div class="stat"><span class="stat-num" id="sQuests">0</span><span class="stat-lbl">Franchises Done</span></div>
  </div>
</div>

<!-- SPARE BOXES BANNER -->
<div class="spare-banner" id="spareBanner">

const KEY = 'brb_bq_v2';
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){done={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}

/* ── helpers ── */
const lineDone=id=>!!done[id];
function qStats(q){
  let tot=0,dn=0,bk=0,dbk=0;
  q.moves.forEach(m=>m.books.forEach(b=>{tot++;bk+=b.count;if(lineDone(b.id)){dn++;dbk+=b.count;}}));
  return{tot,dn,bk,dbk};
}
function qDone(q){const s=qStats(q);return s.tot===0||s.dn===s.tot;}
function mvDone(m){return m.books.length>0&&m.books.every(b=>lineDone(b.id));}
function pct(n,d){return d?Math.round(n/d*100):0;}
function dashOffset(circ,p){return circ*(1-p/100);}

/* ── particles ── */
const pCanvas=document.getElementById('particles'),pCtx=pCanvas.getContext('2d');
let pts=[];
function initParticles(){
  pCanvas.width=innerWidth;pCanvas.height=innerHeight;
  pts=Array.from({length:60},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.4+.4,
    vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
    o:Math.random()*.35+.05
  }));
}
function animPart(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=pCanvas.width;if(p.x>pCanvas.width)p.x=0;
    if(p.y<0)p.y=pCanvas.height;if(p.y>pCanvas.height)p.y=0;
    pCtx.beginPath();pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle=`rgba(255,215,0,${p.o})`;pCtx.fill();
  });
  requestAnimationFrame(animPart);
}
window.addEventListener('resize',initParticles);
initParticles();animPart();

/* ── burst confetti ── */
const bCanvas=document.getElementById('burst'),bCtx=bCanvas.getContext('2d');
bCanvas.width=innerWidth;bCanvas.height=innerHeight;
let confetti=[];
function burst(x,y,col){
  const colors=col?[col]:['#FFD700','#00E5A0','#FF3B5C','#fff','#FF9500'];
  for(let i=0;i<40;i++){
    confetti.push({x,y,vx:(Math.random()-0.5)*9,vy:(Math.random()-2.5)*8,
      r:Math.random()*5+3,c:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,drot:(Math.random()-0.5)*15,life:1});
  }
  animBurst();
}
function animBurst(){
  bCtx.clearRect(0,0,bCanvas.width,bCanvas.height);
  confetti=confetti.filter(c=>c.life>0);
  confetti.forEach(c=>{
    c.x+=c.vx;c.y+=c.vy;c.vy+=0.35;c.rot+=c.drot;c.life-=0.025;
    bCtx.save();bCtx.translate(c.x,c.y);bCtx.rotate(c.rot*Math.PI/180);
    bCtx.globalAlpha=c.life;bCtx.fillStyle=c.c;
    bCtx.fillRect(-c.r/2,-c.r/2,c.r,c.r);
    bCtx.restore();
  });
  if(confetti.length)requestAnimationFrame(animBurst);
}

/* ── toast ── */
let toastTimer;
function toast(msg,isMint){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast'+(isMint?' mint':'')+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

const DOPAMINE_MOVE=['Nice move! 📦','That stack is GONE 💪','One box down 🎯','Boom. ✅','Keep going! 🔥'];
const DOPAMINE_QUEST=['FRANCHISE FILED 🏆','COMPLETE! 🎉','LOCKED IN! 🔒','DONE! ⭐'];
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

/* ── publisher colours ── */
const PUB_DOT={marvel:'#E63946',dc:'#2979FF',indie:'#00BFA5',licensed:'#9C27B0',other:'#607D8B'};

/* ── ring update ── */
function setRing(el,p,circ){
  const offset=circ*(1-p/100);
  el.style.strokeDashoffset=offset;
}

/* ── master XP ── */
function updateXP(){
  let tot=0,dn=0,bk=0,dbk=0,dq=0;
  DATA.quests.forEach(q=>{const s=qStats(q);tot+=s.tot;dn+=s.dn;bk+=s.bk;dbk+=s.dbk;if(qDone(q))dq++;});
  const p=pct(dn,tot);
  document.getElementById('masterPct').textContent=p+'%';
  setRing(document.getElementById('masterRing'),p,339.3);
  document.getElementById('sDone').textContent=dn;
  document.getElementById('sTotal').textContent=tot;
  document.getElementById('sBooks').textContent=dbk.toLocaleString();
  document.getElementById('sQuests').textContent=dq;
}

/* ── next sweep ── */
function updateNext(){
  const ordered=[...DATA.quests].sort((a,b)=>{
    const ca=qDone(a),cb=qDone(b);if(ca!==cb)return ca?1:-1;return b.moveBooks-a.moveBooks;});
  let nb=null,nm=null,nq=null;
  for(const q of ordered){if(qDone(q))continue;
    for(const m of q.moves){for(const b of m.books){if(!lineDone(b.id)){nb=b;nm=m;nq=q;break;}}if(nb)break;}if(nb)break;}
  if(!nb){
    document.getElementById('nextSeries').textContent='Every franchise filed!';
    document.getElementById('nextFrom').textContent='🏆';
    document.getElementById('nextTo').textContent='DONE';
    document.getElementById('nextRange').textContent='You did it. The whole collection.';
    return;
  }
  document.getElementById('nextFrom').textContent='Box '+nm.from;
  document.getElementById('nextTo').textContent='Box '+nm.to;
  document.getElementById('nextSeries').textContent=nb.title;
  document.getElementById('nextRange').textContent=nb.range+' · '+nb.year+' · '+nb.count+' books';
  document.getElementById('nextCard').dataset.qid=nq.id;
}
function jumpToNext(){
  const qid=document.getElementById('nextCard').dataset.qid;
  if(!qid)return;
  const el=document.querySelector('.quest[data-qid="'+qid+'"]');
  if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'start'});}
}

/* ── dashboard pills ── */
function buildDash(){
  const host=document.getElementById('dash');host.innerHTML='';
  const pubs=['all','marvel','dc','indie','licensed','other'];
  const labels={all:'All',marvel:'Marvel',dc:'DC',indie:'Indie',licensed:'Licensed',other:'Other'};
  pubs.forEach(p=>{
    const pill=document.createElement('button');pill.className='pill'+(p==='all'?' active':'');
    pill.dataset.filter=p;
    let tot=0,dn=0;
    DATA.quests.forEach(q=>{if(p==='all'||q.pub===p){const s=qStats(q);tot+=s.tot;dn+=s.dn;}});
    const pp=pct(dn,tot);
    pill.innerHTML=`${p!=='all'?`<span class="pill-dot" style="background:${PUB_DOT[p]}"></span>`:''}${labels[p]}<span class="pill-pct">${pp}%</span>`;
    pill.addEventListener('click',()=>{
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      pill.classList.add('active');
      document.querySelectorAll('.quest').forEach(q=>{
        const match=p==='all'||q.dataset.pub===p;
        q.toggleAttribute('data-hidden',!match);
      });
    });
    host.appendChild(pill);
  });
}

/* ── RENDER ── */
function render(){
  const host=document.getElementById('quests');host.innerHTML='';
  const ordered=[...DATA.quests].sort((a,b)=>{
    const ca=qDone(a),cb=qDone(b);if(ca!==cb)return ca?1:-1;return b.moveBooks-a.moveBooks;});
  ordered.forEach(q=>host.appendChild(makeCard(q)));
  updateXP();updateNext();buildDash();
}

function makeCard(q){
  const el=document.createElement('div');
  el.className='quest'+(qDone(q)?' done':'');
  el.dataset.qid=q.id;el.dataset.pub=q.pub;
  el.style.setProperty('--accent',q.color);
  const s=qStats(q);const p=pct(s.dn,s.tot)||0;
  const circ=135.2;
  const tgtBoxes=q.targetBoxes.map(b=>`<span class="q-box-tag${q.spareBoxes.includes(b)?' spare':''}">${b}${q.spareBoxes.includes(b)?'★':''}</span>`).join('');

  const movesHtml=q.moves.length?q.moves.map((m,mi)=>{
    const mdone=mvDone(m);
    const lineTot=m.books.length,lineDn=m.books.filter(b=>lineDone(b.id)).length;
    const mp=lineTot?Math.round(lineDn/lineTot*100):0;
    const isSpare=q.spareBoxes.includes(m.to);
    const lines=m.books.map(b=>{
      const ck=lineDone(b.id);
      return `<div class="line${ck?' checked':''}" data-id="${b.id}">
        <input type="checkbox" ${ck?'checked':''} data-id="${b.id}">
        <span class="cbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3.5"><path d="M5 12l5 5L20 6"/></svg></span>
        <div class="l-body">
          <div class="l-title">${b.title}</div>
          <div class="l-range">${b.range}<span style="margin-left:8px;opacity:.6">${b.year}</span></div>
        </div>
        <span class="l-cnt">${b.count}</span>
      </div>`;}).join('');
    return `<div class="move${mdone?' done':''}" data-mvid="${q.id}-${mi}">
      <div class="move-hd">
        <div class="mv-route">
          <span class="bchip">Box ${m.from}</span>
          <span class="mv-arr">→</span>
          <span class="bchip dest${isSpare?' spare':''}">Box ${m.to}${isSpare?' ★':''}</span>
          <span class="mv-label">${q.short}</span>
        </div>
        <span class="mv-count">${m.count}</span>
      </div>
      <div class="move-prog"><div class="move-prog-fill" style="width:${mp}%"></div></div>
      <div class="lines">${lines}</div>
    </div>`;}).join('')
    :`<div class="move done"><div class="move-hd"><span class="mv-label" style="color:var(--mint)">✓ Already consolidated</span></div></div>`;

  const cluesHtml=`<div class="clue-grid">${q.clues.map(c=>`<div class="clue">
    <div class="clue-box">Box ${c.box}</div>
    <div class="clue-yr">${c.year_range} · ${c.count} books</div><div class="clue-yr" style="color:var(--gold);font-size:10px;margin-top:2px">${c.location||""}</div>
    <div class="clue-titles">${c.sample_titles.join(', ')}</div>
  </div>`).join('')}</div>`;

  el.innerHTML=`<div class="q-head">
    <div class="q-spine" style="background:${q.color}"></div>
    <div class="q-title-col">
      <div class="q-name">${q.short}</div>
      <div class="q-meta-row">
        <span class="q-pub ${q.pub}">${q.pub.toUpperCase()}</span>
        <span class="q-count">${q.total} books · ${q.lineCount} steps</span>
      </div>
    </div>
    <span class="q-stamp">FILED</span>
    <div class="q-ring">
      <svg viewBox="0 0 52 52">
        <circle class="q-rbg" cx="26" cy="26" r="21.5"/>
        <circle class="q-rfg" cx="26" cy="26" r="21.5" stroke="${q.color}" id="qring-${q.id}" style="stroke-dashoffset:${dashOffset(circ,p)}"/>
      </svg>
      <div class="q-rpct">${p}%</div>
    </div>
    <svg class="q-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="q-body">
    <div class="q-boxes-row"><span class="q-boxes-label">Files into →</span>${tgtBoxes}</div>
    <div class="sec-label">Sweeps</div>
    ${movesHtml}
    <div class="sec-label" style="margin-top:18px">Where to find it after</div>
    ${cluesHtml}
  </div>`;

  /* toggle */
  el.querySelector('.q-head').addEventListener('click',ev=>{
    if(ev.target.closest('input,.cbox'))return;
    el.classList.toggle('open');
  });

  /* checkboxes */
  el.querySelectorAll('.line').forEach(lineEl=>{
    lineEl.addEventListener('click',ev=>{
      if(ev.target.tagName==='INPUT')return;
      const inp=lineEl.querySelector('input');inp.checked=!inp.checked;
      handleCheck(lineEl,inp,q,el);
    });
    const inp=lineEl.querySelector('input');
    inp.addEventListener('change',()=>handleCheck(lineEl,inp,q,el));
  });
  return el;
}

function handleCheck(lineEl,inp,q,cardEl){
  const bid=inp.dataset.id;done[bid]=inp.checked;save();
  lineEl.classList.toggle('checked',inp.checked);

  /* move progress bar */
  const mvEl=lineEl.closest('.move');
  const lines=mvEl.querySelectorAll('.line');
  const dnLines=[...lines].filter(l=>l.classList.contains('checked')).length;
  const mp=Math.round(dnLines/lines.length*100);
  mvEl.querySelector('.move-prog-fill').style.width=mp+'%';

  /* quest ring */
  const s=qStats(q);const p=pct(s.dn,s.tot)||0;
  const rEl=cardEl.querySelector('#qring-'+q.id);
  if(rEl){rEl.style.strokeDashoffset=dashOffset(135.2,p);}
  cardEl.querySelector('.q-rpct').textContent=p+'%';

  /* move done */
  const mvidParts=mvEl.dataset.mvid.split('-');
  const m=q.moves[parseInt(mvidParts[1])];
  const wasMvDone=mvEl.classList.contains('done');
  const isMvDone=mvDone(m);
  mvEl.classList.toggle('done',isMvDone);
  if(isMvDone&&!wasMvDone){
    burst(window.innerWidth/2,window.innerHeight*.35,'#00E5A0');
    toast(rnd(DOPAMINE_MOVE),true);
  }

  /* quest done */
  const wasQDone=cardEl.classList.contains('done');
  const isQDone=qDone(q);
  cardEl.classList.toggle('done',isQDone);
  if(isQDone&&!wasQDone){
    setTimeout(()=>{burst(window.innerWidth/2,window.innerHeight/3);},100);
    setTimeout(()=>{burst(window.innerWidth*.3,window.innerHeight*.4,'#FFD700');},350);
    toast('🏆 '+q.short+' '+rnd(DOPAMINE_QUEST),false);
  }

  updateXP();updateNext();buildDash();
}

/* ── search ── */
document.getElementById('findInput').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  const host=document.getElementById('finder');
  if(q.length<2){host.style.display='none';return;}
  const hits=[];
  DATA.quests.forEach(Q=>Q.clues.forEach(c=>{
    const inT=c.sample_titles.some(t=>t.toLowerCase().includes(q));
    const inF=Q.name.toLowerCase().includes(q)||Q.short.toLowerCase().includes(q);
    if(inT||inF)hits.push({box:c.box,yr:c.year_range,fran:Q.short,
      titles:c.sample_titles.filter(t=>t.toLowerCase().includes(q))});
  }));
  if(!hits.length){
    host.innerHTML=`<div class="finder-card"><h4>No match for "${this.value}"</h4><p style="color:var(--silver2);font-size:13px">Try a series name or character.</p></div>`;
  }else{
    const rows=hits.slice(0,8).map(h=>`<div class="finder-hit">
      <span class="fbx">Box ${h.box}</span>
      <div class="finfo"><div class="fyr">${h.fran} · ${h.yr}</div>
      <div class="fnm">${(h.titles.length?h.titles:[h.fran]).slice(0,3).join(' · ')}</div></div>
    </div>`).join('');
    host.innerHTML=`<div class="finder-card"><h4>Find: "${this.value}"</h4>${rows}</div>`;
  }
  host.style.display='block';
});

/* ── spare box checklist ── */
(function(){
  const SPARE_KEY=KEY+'_spare';
  const banner=document.getElementById('spareBanner');
  const cb=document.getElementById('spareCheck');
  if(!banner||!cb)return;
  // restore state
  if(localStorage.getItem(SPARE_KEY)==='1'){
    banner.classList.add('checked');
    setTimeout(()=>banner.classList.add('dismissed'),600);
    cb.checked=true;
  }
  function toggle(){
    cb.checked=!cb.checked;
    localStorage.setItem(SPARE_KEY,cb.checked?'1':'0');
    banner.classList.toggle('checked',cb.checked);
    if(cb.checked){
      setTimeout(()=>banner.classList.add('dismissed'),700);
      toast('Spare boxes labelled ✓ Let\'s go!',true);
      burst(window.innerWidth/2, document.getElementById('spareBanner').getBoundingClientRect().top+20,'#00E5A0');
    }else{
      banner.classList.remove('dismissed');
    }
  }
  banner.addEventListener('click',e=>{
    if(e.target.closest('a'))return;
    toggle();
  });
})();


/* ── spare banner ── */
(function(){
  const banner=document.getElementById('spareBanner');
  const cb=document.getElementById('spareCheck');
  if(localStorage.getItem('brb_spare_done_v3')==='1'){
    banner.classList.add('dismissed');
  }
  cb.addEventListener('change',()=>{
    if(cb.checked){
      const cbox=banner.querySelector('.spare-cbox');
      cbox.style.background='var(--mint)';
      cbox.style.borderColor='var(--mint)';
      cbox.querySelector('svg').style.opacity='1';
      toast('📦 Spare boxes labelled — let\'s go!',true);
      burst(window.innerWidth/2,window.innerHeight*.25,'#00E5A0');
      localStorage.setItem('brb_spare_done_v3','1');
      setTimeout(()=>banner.classList.add('dismissed'),900);
    }
  });
})();

render();
</script>
