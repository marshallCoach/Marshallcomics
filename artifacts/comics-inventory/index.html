<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restore path after GitHub Pages 404 SPA redirect
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Marshall Comics DB</title>
    <meta name="description" content="BlackReadBrown Inventory Hub — Roberto Marshall's personal comic book collection. 12,000+ comics across 84 boxes, organized by publisher, era, and key issues." />
    <link rel="icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
